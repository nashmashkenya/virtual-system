kind = "web"
previewPath = "/"
title = "ElimuPawa Classroom"
version = "1.0.0"
id = "artifacts/elimu-pawa"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24548

[services.development]
run = "pnpm --filter @workspace/elimu-pawa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elimu-pawa", "run", "build" ]
publicDir = "artifacts/elimu-pawa/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24548"
BASE_PATH = "/"
