kind = "mobile"
previewPath = "/mobile/"
title = "ElimuPawa Mobile"
version = "1.0.0"
id = "artifacts/elimu-pawa-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 20633

[services.development]
run = "pnpm --filter @workspace/elimu-pawa-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elimu-pawa-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/elimu-pawa-mobile", "run", "serve" ]

[services.env]
PORT = "20633"
BASE_PATH = "/mobile/"
